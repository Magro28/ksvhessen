name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /ksvhessen
      - name: Fix project-site asset paths
        run: |
          find out -type f -name '*.html' -print0 | xargs -0 sed -i \
            -e 's#src="/ksv-logo.svg"#src="/ksvhessen/ksv-logo.svg"#g' \
            -e 's#href="/ksv-logo.svg"#href="/ksvhessen/ksv-logo.svg"#g' \
            -e 's#href="/mannschaften"#href="/ksvhessen/mannschaften/"#g' \
            -e 's#href="/spiele"#href="/ksvhessen/spiele/"#g' \
            -e 's#href="/verein"#href="/ksvhessen/verein/"#g'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
